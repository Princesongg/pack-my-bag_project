  <script type="text/javascript">
    // 手機版表格切換欄位數
	var VER = "C";
    var interval = [4, 4, 4, 2];
   
    jQuery(document).ready(function() {
      App.init();
	  console.log("load start");
	  DefaultLocation = $("#Location").val();
	  DefaultItem = $("#Item").val();	  
	  GetMOD(VER, DefaultLocation, DefaultItem, '#MonthlyMean_MOD');
    });

   function HtmlEscape(input) {
	  return decodeURI(encodeURI(input));
   }	
 
   function GetMOD(VER, Location, Item, TARGET_DIV) {
	  
	 var date = new Date();
     var TimeString = date.getMilliseconds();  
	 var MOD_DIR = "/V8/"+VER+"/C/Statistics/MonthlyMean/MOD/";
	 var MOD_FILE = Location+"_"+Item+".html?ID="+TimeString;
	 //alert(MOD_DIR+MOD_FILE);
	
	 $.get(MOD_DIR+MOD_FILE, '', function(data) { 
		$(TARGET_DIV).html(HtmlEscape(data));
		var ItemText = $("#Item option:selected").text();
		var TableTitle = $('#MonthlyMean_MOD tr:first-child').data('tabletitle');
		var TableUnit = $('#MonthlyMean_MOD tr:first-child').data('tableunit');
		if (TableTitle=="降水量")  TableTitle="降水量（平均）"; 
		$('#SubTitle').html(TableTitle+"<span class=\"notes\">單位："+TableUnit+"</span>");
        //alert(data);		
		console.log( 'Get '+MOD_FILE+' Success' );
	 }).fail(function(){
		console.log( 'Get '+MOD_FILE+' Failed!' );
	 });
	
	    jQuery.ajaxSetup({
		async: true
	    }); 
		 
     }	  
	 
     $("#Location").change(function() {  
			SelectLocation = $("#Location").val();
			
            // 中國和全球只有4個選項			
			if (SelectLocation != "Taiwan") { 
              $("#Item option[value='sunshine']").hide();
			  $("#Item option[value='meantxmin']").show();
			  $("#Item option[value='txminle10day']").hide();
			  $("#Item option[value='meantxmax']").show();
			  $("#Item option[value='txmaxge30day']").hide();
			  $("#Item option[value='tx']").hide();
			  $("#Item option[value='txge25day']").hide();
			  $("#Item option[value='stnpres']").hide();
			  $("#Item option[value='rh']").hide();
			  $("#Item option[value='precp']").show();
			  $("#Item option[value='precp-median']").hide();
			  $("#Item option[value='precpday']").show();
			  $("#Item option[value='CamtMean']").hide();
			  $("#Item option[value='ws']").hide(); 			  
			  SelectItem = "meantxmin";
			  $("#Item option[value='meantxmin']").attr('selected','selected');
        	} else { 		
			  $("#Item option[value='sunshine']").show();
			  $("#Item option[value='meantxmin']").show();
			  $("#Item option[value='txminle10day']").show();
			  $("#Item option[value='meantxmax']").show();
			  $("#Item option[value='txmaxge30day']").show();
			  $("#Item option[value='tx']").show();
			  $("#Item option[value='txge25day']").show();
			  $("#Item option[value='stnpres']").show();
			  $("#Item option[value='rh']").show();
			  $("#Item option[value='precp']").show();
			  $("#Item option[value='precp-median']").show();
			  $("#Item option[value='precpday']").show();
			  $("#Item option[value='CamtMean']").show();
			  $("#Item option[value='ws']").show();
              SelectItem = $("#Item").val();			  
            }
            change(0);count = 0;			
			GetMOD(VER, SelectLocation, SelectItem, '#MonthlyMean_MOD');
	 });  
	 
	 $("#Item").change(function() {  
			SelectLocation = $("#Location").val();
			SelectItem = $("#Item").val();  
			  change(0);count = 0;
			  GetMOD(VER, SelectLocation, SelectItem, '#MonthlyMean_MOD'); 
			  total = ["sunshine", "txminle10day", "txmaxge30day", "txge25day", "precp", "precpday"]; 
			  
			  // 2024.7.16  新增雨量中位數統計欄位 precpmedian
			  if (SelectItem== "precp-median")  
			    $('#item').html('年累積降水量');
			  else if (total.indexOf(SelectItem)!= "-1")  
			    $('#item').html('合計'); 
    		  else 
                $('#item').html('平均');  
	 });  
	   
  </script>
